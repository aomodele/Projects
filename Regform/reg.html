<!DOCTYPE html>
<head>
  <title>
    Registration form
  </title>
  <link rel="stylesheet" href="reg.css">
</head>
<body>
  <div class="reg-box">
   <div class="reg-content">
        <h1> <p class="log-txt">Login</p></h1>
    <div class="userinfo">
      <input type="text" placeholder=" Enter Username">
      <input class="password" type="text" placeholder="Enter Password">
    </div>
    <div class="user-guide"> 
      <div class="rem-box">
        <input  type="checkbox">
        <p class="rem-txt">
        Remember me
      </p>
      </div>
      <button class="forgotbtn">
        Forgot Password?
      </button>
    </div>
    <button class="login-btn">
      Login
    </button>
    <div class="acct-reg-info">
      <p class="acct-req-txt">
        Don't have an account? <button class="reg-btn">Register</button>
      </p>
   </div> 
    </div>
  </div>
</body>
