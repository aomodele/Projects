<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="form.css">
</head>
<body>

<div class="card">
    <div class="card-bg card-bg-1"></div>
    <div class="card-bg card-bg-2"></div>
    <img class="logo logo-1" src="thumbnails/Google.png" alt="">
    <img class="logo logo-2" src="thumbnails/Google.png" alt="">

    <div class="form signin">
        <form>
            <h2>Sign In</h2>
            <input type="email" placeholder="Email">
            <input type="password" placeholder="Password">
            <button>SIGN IN</button>
            <p>Don't have an account? <a><em>Sign up</em></a></p>
        </form>
    </div>

    <div class="form signup active">
        <form>
            <h2>Register</h2>
            <input type="text" placeholder="Name">
            <input type="email" placeholder="Email">
            <button>SIGN UP</button>
            <p>Already have an account? <a><em>Sign in</em></a></p>
        </form>
    </div>
</div>

<script src="
main.js"></script>
</body>
</html>
