<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset ="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    Login Form | Lizdam
  </title>
<link rel="stylesheet" href="loginform.css">
</head>
<body>
   <div class="container">
    <div class="form-container">
      <div class="form-blob">
        <img src="thumbnails/logo.png" alt="blob" class="blob-image blob-image--1">
        <img src="thumbnails/logo.png" alt="blob" class="blob-image blob-image--2">
       <img src="thumbnails/logo.png" alt="blob" class="blob-image blob-image--3">
      </div> 

  <div class="form-header">
    <p> Please enter your details </p>
      <h1> Welcome Back </h1>
      </div>
    <form class="form-box">
      <div class="input-group">
        <input type="email" id="email" class="input-field" placeholder="" required>
       <label for="email" class="floating-label">Email address</label>
      </div> 
      <div class="input-group">
        <input type="password" id="password" class="input-field" placeholder="" required>
       <label for="password" class="floating-label">Password</label>
      </div> 
      <div class="input-group checkbox">
      <div class="form-col remember-me"> <input type="checkbox" id="remember-me-checkbox" class="checkbox-field"><label for="remember-me-checkbox">Remember me</label> 
      </div>
      <div class="form-col"> <a href="#" class="form-link"> Forgot password?</a>
      </div>
      </div>
      <button type="submit" class="signinbtn">Sign in    
      </button>
    </form>
    <div class="form-divider">
      <p>Or</p>
    </div>
    <div class="form-bottom">
      <div class="form-social">
        <button class="form-btn form-btn--social"> 
          <img src="thumbnails/google-icon.png" class="btn-icon" alt="social-icon"></button>
          <button class="form-btn form-btn--social"> 
            <img src="thumbnails/Appleicon-nobg.png" class="btn-icon" alt="social-icon"></button>
            <button class="form-btn form-btn--social"> 
              <img src="thumbnails/facebookicon.webp" class="btn-icon" alt="social-icon"></button>
      </div>
      <p>Don't have an account? <a href="#" class="form-link">Sign up</a> </p>
    </div>
  </div>
 </div>
 <script src="loginform.js"></script>
</body>
</html>
